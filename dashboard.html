<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>업무 대시보드</title>
<style>
/* 토큰은 Folio(노션 스타일 디자인 시스템) 정본에서 가져옵니다. 직접 고치지 않습니다. */
:root {

  --fl-font-sans:
    "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", "Segoe UI", Roboto, "Helvetica Neue", Arial,
    "Noto Sans KR", sans-serif;
  --fl-font-mono:
    ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas,
    "Liberation Mono", monospace;
  --fl-font-serif: "Source Serif Pro", "Noto Serif KR", Georgia, serif;


  /* --- Surfaces (white-forward, layered with subtle warm tint) ---------- */
  --fl-bg: #ffffff; /* page background — Notion-style white */
  --fl-surface: #ffffff; /* cards, popovers, modals */
  --fl-surface-2: #f7f6f3; /* sidebar, secondary surfaces */
  --fl-surface-3: #f1f0ec; /* sunken / inset / code */
  --fl-overlay: rgba(15, 15, 15, 0.32);

  /* --- Interactive states (apply on top of any surface) ----------------- */
  --fl-hover: rgba(55, 53, 47, 0.06);
  --fl-hover-strong: rgba(55, 53, 47, 0.09);
  --fl-active: rgba(55, 53, 47, 0.12);
  --fl-selected: rgba(35, 131, 226, 0.12);

  /* --- Text -------------------------------------------------------------- */
  --fl-text: #37352f;
  --fl-text-secondary: #525049; /* darker — legible for body context */
  --fl-text-tertiary: #787774; /* Notion-matched, for meta only */
  --fl-text-quaternary: #9b9a97; /* labels, hints */
  --fl-text-placeholder: #b9b8b3;
  --fl-text-disabled: #b9b8b3;
  --fl-text-on-accent: #ffffff;
  --fl-text-link: #2d6fc5;

  /* --- Borders ----------------------------------------------------------- */
  --fl-border-subtle: rgba(15, 14, 12, 0.06);
  --fl-border: rgba(15, 14, 12, 0.10);
  --fl-border-strong: rgba(15, 14, 12, 0.18);
  --fl-border-focus: #3d6ff2;

  /* --- Accent (slate-blue) ---------------------------------------------- */
  --fl-accent-50: #ecf2ff;
  --fl-accent-100: #d9e3ff;
  --fl-accent-200: #b3c5ff;
  --fl-accent-400: #6a8cff;
  --fl-accent: #3d6ff2; /* primary brand */
  --fl-accent-600: #2d5bd9;
  --fl-accent-700: #1f47b3;

  /* --- Semantic ---------------------------------------------------------- */
  --fl-success: #2f9e6b;
  --fl-success-bg: #e7f5ee;
  --fl-warning: #cb912f;
  --fl-warning-bg: #faf3dd;
  --fl-danger: #d8514a;
  --fl-danger-bg: #fbe9e7;
  --fl-info: #3d6ff2;
  --fl-info-bg: #ecf2ff;

  /* --- Block tints (text colors) — Notion-authentic text hues -----------*/
  --fl-tint-gray: #787774;
  --fl-tint-brown: #976d57;
  --fl-tint-orange: #cc782f;
  --fl-tint-yellow: #cb912f;
  --fl-tint-green: #548164;
  --fl-tint-blue: #487ca5;
  --fl-tint-purple: #8a67ab;
  --fl-tint-pink: #b35488;
  --fl-tint-red: #c4554d;

  /* --- Chart palette — brighter, cleaner data-viz hues (Notion-flavored).
     Signature Notion blue #2383E2 leads; the rest share high chroma so series
     read as vivid and distinct rather than muddy. -----------------------*/
  --fl-chart-gray: #9b9a97;
  --fl-chart-brown: #a8724e;
  --fl-chart-orange: #f1942c;
  --fl-chart-yellow: #e5b228;
  --fl-chart-green: #1fa774;
  --fl-chart-blue: #2383e2;
  --fl-chart-purple: #9d68d3;
  --fl-chart-pink: #e255a1;
  --fl-chart-red: #e5484d;

  /* --- Inverse surface — tooltips, toasts, snackbars -------------------- */
  --fl-inverse-surface: #2a2925;
  --fl-inverse-text: #f6f4f1;

  /* --- Block tint backgrounds — Notion-authentic subtle fills ----------- */
  --fl-tint-gray-bg: #f1f1ef;
  --fl-tint-brown-bg: #f3eeee;
  --fl-tint-orange-bg: #f8ecdf;
  --fl-tint-yellow-bg: #faf3dd;
  --fl-tint-green-bg: #eef3ed;
  --fl-tint-blue-bg: #e9f3f7;
  --fl-tint-purple-bg: #f6f3f8;
  --fl-tint-pink-bg: #f9f2f5;
  --fl-tint-red-bg: #faecec;

  /* --- Shadows ----------------------------------------------------------- */
  --fl-shadow-xs: 0 1px 2px rgba(15, 14, 12, 0.04);
  --fl-shadow-sm: 0 1px 3px rgba(15, 14, 12, 0.06), 0 1px 2px rgba(15, 14, 12, 0.04);
  --fl-shadow-md:
    0 2px 4px rgba(15, 14, 12, 0.04),
    0 4px 12px rgba(15, 14, 12, 0.08);
  --fl-shadow-lg:
    0 4px 8px rgba(15, 14, 12, 0.04),
    0 12px 32px rgba(15, 14, 12, 0.12);
  --fl-shadow-xl:
    0 8px 16px rgba(15, 14, 12, 0.06),
    0 24px 48px rgba(15, 14, 12, 0.16);

  color-scheme: light;


  /* --- Type scale (px) — Korean-readable. Block body uses --lg(17px). ----*/
  --fl-text-2xs: 11px;
  --fl-text-xs: 12px;
  --fl-text-sm: 13px;
  --fl-text-base: 14px;
  --fl-text-md: 15px;
  --fl-text-lg: 17px; /* page body / block content — was 16, +1 for Korean */
  --fl-text-xl: 19px;
  --fl-text-2xl: 24px;
  --fl-text-3xl: 30px;
  --fl-text-4xl: 38px;
  --fl-text-5xl: 46px;

  /* --- Line heights — tuned for Korean -------------------------------- */
  --fl-leading-tight: 1.25;
  --fl-leading-snug: 1.4;
  --fl-leading-normal: 1.6; /* was 1.55 — slightly more air for Hangul */
  --fl-leading-relaxed: 1.75;

  /* --- Font weights ------------------------------------------------------ */
  --fl-weight-regular: 400;
  --fl-weight-medium: 500;
  --fl-weight-semibold: 600;
  --fl-weight-bold: 700;

  /* --- Spacing (4px base) ----------------------------------------------- */
  --fl-space-0: 0;
  --fl-space-1: 2px;
  --fl-space-2: 4px;
  --fl-space-3: 6px;
  --fl-space-4: 8px;
  --fl-space-5: 12px;
  --fl-space-6: 16px;
  --fl-space-7: 20px;
  --fl-space-8: 24px;
  --fl-space-9: 32px;
  --fl-space-10: 40px;
  --fl-space-11: 48px;
  --fl-space-12: 64px;
  --fl-space-13: 80px;
  --fl-space-14: 96px;

  /* --- Radius ------------------------------------------------------------ */
  --fl-radius-xs: 3px;
  --fl-radius-sm: 4px;
  --fl-radius: 6px;
  --fl-radius-md: 8px;
  --fl-radius-lg: 12px;
  --fl-radius-xl: 16px;
  --fl-radius-2xl: 20px;
  --fl-radius-full: 9999px;

  /* --- Motion ------------------------------------------------------------ */
  --fl-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --fl-ease-in: cubic-bezier(0.4, 0, 1, 1);
  --fl-ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
  --fl-ease-spring: cubic-bezier(0.17, 0.86, 0.32, 1.28);

  --fl-duration-fast: 120ms;
  --fl-duration-normal: 180ms;
  --fl-duration-slow: 280ms;

  /* --- Layout ------------------------------------------------------------ */
  --fl-sidebar-w: 248px;
  --fl-topbar-h: 44px;
  --fl-page-max-w: 720px;
  --fl-page-max-w-wide: 960px;
  --fl-block-indent: 24px;
  --fl-block-handle-w: 24px;

  /* --- Z-index scale (v0.5) — predictable layering --------------------- */
  --fl-z-base: 1;
  --fl-z-sticky: 100;          /* sticky table headers, toolbars */
  --fl-z-dropdown: 200;        /* select, menu, combobox */
  --fl-z-popover: 300;         /* tooltips, hover cards */
  --fl-z-overlay: 400;         /* modal scrim, drawer scrim */
  --fl-z-modal: 500;           /* dialog content */
  --fl-z-toast: 600;           /* toast / notification */
  --fl-z-command: 700;         /* ⌘K, slash menu */
  --fl-z-coachmark: 800;       /* onboarding spotlights */

  /* --- Focus ring (v0.5) — single source of truth for a11y outlines ---- */
  --fl-focus-ring-w: 2px;
  --fl-focus-ring-offset: 2px;
  --fl-focus-ring-color: var(--fl-accent);
  --fl-focus-ring: 0 0 0 var(--fl-focus-ring-w) var(--fl-bg),
                   0 0 0 calc(var(--fl-focus-ring-w) + var(--fl-focus-ring-offset)) var(--fl-focus-ring-color);

  /* --- Density (v0.5) — toggle data-density on a root container -------- */
  --fl-density-row-h: 32px;     /* default = comfortable */
  --fl-density-row-pad-y: 6px;
  --fl-density-block-gap: 4px;
  --fl-density-section-gap: 16px;

}
@media (prefers-color-scheme: dark) {

  --fl-surface-2: #1f1e1c;

  --fl-hover: rgba(255, 253, 248, 0.05);

  --fl-text: #e8e6e1;
  --fl-text-secondary: #c0bdb5; /* darker variant — readable for body context */
  --fl-text-tertiary: #8e8a82;
  --fl-text-quaternary: #6f6b62;
  --fl-text-placeholder: #5a564f;
  --fl-text-disabled: #5a564f;
  /* dark theme accent is a LIGHT blue (#6a8cff); white text on it fails AA
     (3.08:1, dropping to 1.7:1 on hover/active). Dark navy text passes
     comfortably across all states (5.2 → 9.4:1). */
  --fl-text-on-accent: #15203f;
  --fl-text-link: #8aa9ff;

  --fl-border-subtle: rgba(255, 253, 248, 0.06);
  --fl-border: rgba(255, 253, 248, 0.10);
  --fl-border-strong: rgba(255, 253, 248, 0.18);
  --fl-border-focus: #6a8cff;

  --fl-accent-50: #1a2547;
  --fl-accent-100: #1f3061;
  --fl-accent-200: #2a4a9e;
  --fl-accent-400: #6a8cff;
  --fl-accent: #6a8cff;
  --fl-accent-600: #8aa9ff;
  --fl-accent-700: #b3c5ff;

  --fl-success: #5fc18e;
  --fl-success-bg: #1c3528;
  --fl-warning: #e3b341;
  --fl-warning-bg: #372e20;
  --fl-danger: #e87b75;
  --fl-danger-bg: #3a201d;
  --fl-info: #8aa9ff;
  --fl-info-bg: #1a2547;

  --fl-tint-gray: #9b9b9b;
  --fl-tint-brown: #a27763;
  --fl-tint-orange: #cb7b37;
  --fl-tint-yellow: #d4a23c;
  --fl-tint-green: #4f9768;
  --fl-tint-blue: #447acb;
  --fl-tint-purple: #865dbb;
  --fl-tint-pink: #ba4a78;
  --fl-tint-red: #be524b;

  /* Chart palette — brighter data-viz hues for dark mode (lifted for contrast) */
  --fl-chart-gray: #9e9e97;
  --fl-chart-brown: #bc8e6e;
  --fl-chart-orange: #f4a03c;
  --fl-chart-yellow: #edc04a;
  --fl-chart-green: #34b98a;
  --fl-chart-blue: #4d9de8;
  --fl-chart-purple: #b084e9;
  --fl-chart-pink: #eb6fb1;
  --fl-chart-red: #ec5f63;

  --fl-inverse-surface: #ffffff;
  --fl-inverse-text: #2a2925;

  --fl-tint-gray-bg: rgba(168, 165, 159, 0.14);
  --fl-tint-brown-bg: rgba(217, 163, 122, 0.14);
  --fl-tint-orange-bg: rgba(232, 168, 107, 0.14);
  --fl-tint-yellow-bg: rgba(232, 197, 99, 0.14);
  --fl-tint-green-bg: rgba(127, 207, 163, 0.14);
  --fl-tint-blue-bg: rgba(138, 169, 255, 0.16);
  --fl-tint-purple-bg: rgba(179, 155, 245, 0.16);
  --fl-tint-pink-bg: rgba(232, 143, 189, 0.14);
  --fl-tint-red-bg: rgba(232, 138, 133, 0.14);

  --fl-shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
  --fl-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
  --fl-shadow-md:
    0 2px 4px rgba(0, 0, 0, 0.4),
    0 4px 12px rgba(0, 0, 0, 0.5);
  --fl-shadow-lg:
    0 4px 8px rgba(0, 0, 0, 0.4),
    0 12px 32px rgba(0, 0, 0, 0.6);
  --fl-shadow-xl:
    0 8px 16px rgba(0, 0, 0, 0.5),
    0 24px 48px rgba(0, 0, 0, 0.7);

  color-scheme: dark;
  }
}

/* ---- 페이지 바탕 ---- */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--fl-bg);
  color: var(--fl-text);
  font-family: var(--fl-font-sans);
  font-size: var(--fl-text-base);
  line-height: var(--fl-leading-normal);
  -webkit-font-smoothing: antialiased;
  padding-block: var(--fl-space-10);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: var(--fl-page-max-w-wide); margin: 0 auto; display: grid; gap: var(--fl-space-9); }

/* ---- Folio components.css에서 그대로 가져온 규칙 ---- */
.fl-card { background: var(--fl-surface); border: 1px solid var(--fl-border-subtle); border-radius: var(--fl-radius-md); padding: 16px; }
.fl-table { width: 100%; border-collapse: collapse; font-size: var(--fl-text-sm); }
.fl-table th, .fl-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--fl-border-subtle); border-right: 1px solid var(--fl-border-subtle); vertical-align: middle; }
.fl-table th:last-child, .fl-table td:last-child { border-right: none; }
.fl-table th { font-weight: var(--fl-weight-regular); color: var(--fl-text-secondary); background: var(--fl-surface); font-size: var(--fl-text-xs); height: 32px; user-select: none; }
.fl-table tr:hover td { background: var(--fl-hover); }
.fl-tag { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; height: 22px; border-radius: var(--fl-radius-sm); background: var(--fl-tint-gray-bg); color: var(--fl-tint-gray); font-size: var(--fl-text-xs); font-weight: var(--fl-weight-medium); white-space: nowrap; }
.fl-tag--green { background: var(--fl-tint-green-bg); color: var(--fl-tint-green); }
.fl-tag--blue { background: var(--fl-tint-blue-bg); color: var(--fl-tint-blue); }
.fl-tag--red { background: var(--fl-tint-red-bg); color: var(--fl-tint-red); }
.fl-tag--yellow { background: var(--fl-tint-yellow-bg); color: var(--fl-tint-yellow); }

/* ---- 이 대시보드의 배치 ---- */
.icon { font-size: 52px; line-height: 1; margin-bottom: var(--fl-space-4); }
h1 { margin: 0; font-size: var(--fl-text-4xl); font-weight: var(--fl-weight-bold); line-height: var(--fl-leading-tight); letter-spacing: -0.025em; }
.props { display: grid; gap: var(--fl-space-2); margin-top: var(--fl-space-6); color: var(--fl-text-tertiary); font-size: var(--fl-text-sm); }
.prop { display: flex; gap: var(--fl-space-6); }
.prop b { width: 80px; flex: none; font-weight: var(--fl-weight-regular); color: var(--fl-text-quaternary); }
.prop span { color: var(--fl-text-secondary); }
h2 { margin: 0 0 var(--fl-space-5); font-size: var(--fl-text-2xl); font-weight: var(--fl-weight-semibold); line-height: var(--fl-leading-snug); }
hr { border: 0; border-top: 1px solid var(--fl-border-subtle); margin: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--fl-space-5); }
.kpi .label { font-size: var(--fl-text-xs); color: var(--fl-text-tertiary); }
.kpi .value { font-size: var(--fl-text-3xl); font-weight: var(--fl-weight-bold); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: var(--fl-space-2); }
.kpi .note { font-size: var(--fl-text-xs); color: var(--fl-text-tertiary); margin-top: var(--fl-space-1); }
.up { color: var(--fl-success); }
.down { color: var(--fl-danger); }
.legend { display: flex; gap: var(--fl-space-6); font-size: var(--fl-text-xs); color: var(--fl-text-tertiary); margin-bottom: var(--fl-space-4); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: var(--fl-radius-xs); margin-right: var(--fl-space-3); vertical-align: -1px; }
.chart { overflow-x: auto; margin-bottom: var(--fl-space-6); }
.scroll { overflow-x: auto; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.rate-up { background: var(--fl-tint-green-bg); color: var(--fl-tint-green); font-weight: var(--fl-weight-medium); }
td.rate-down { background: var(--fl-tint-red-bg); color: var(--fl-tint-red); font-weight: var(--fl-weight-medium); }
ul.list { list-style: none; margin: 0; padding: 0; display: grid; }
ul.list li { padding: var(--fl-space-4) 0; border-bottom: 1px solid var(--fl-border-subtle); display: flex; gap: var(--fl-space-5); align-items: baseline; flex-wrap: wrap; }
ul.list li:last-child { border-bottom: 0; }
.who { font-weight: var(--fl-weight-medium); color: var(--fl-text); }
.empty { color: var(--fl-text-quaternary); }
@media (max-width: 600px) {
  h1 { font-size: var(--fl-text-3xl); }
  .fl-table th, .fl-table td { padding: 6px; }
}
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="icon" id="icon" aria-hidden="true"></div>
    <h1 id="title"></h1>
    <div class="props">
      <div class="prop"><b>기준</b><span id="subtitle"></span></div>
      <div class="prop"><b>팀</b><span id="team"></span></div>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <hr>

  <section>
    <h2 id="perf-title"></h2>
    <div class="legend"><span><i id="lg-prev"></i><span id="lg-prev-t"></span></span><span><i id="lg-cur"></i><span id="lg-cur-t"></span></span></div>
    <div class="chart" id="chart"></div>
    <div class="scroll"><table class="fl-table" id="perf-table"></table></div>
  </section>

  <hr>

  <section>
    <h2>업무 현황</h2>
    <div class="scroll"><table class="fl-table" id="task-table"></table></div>
  </section>

  <hr>

  <section class="fl-card">
    <h2>이슈·지원 요청</h2>
    <ul class="list" id="issues"></ul>
  </section>

  <section class="fl-card">
    <h2>다음 주 주요 일정</h2>
    <ul class="list" id="schedule"></ul>
  </section>
</main>

<script>
(function () {
  // ▼▼▼ 데이터는 여기만 바꿉니다. 아래 코드는 이 값을 읽어 화면을 그립니다. ▼▼▼
  var DATA = {
    icon: "📊",
    title: "디지털혁신팀 업무 대시보드",
    subtitle: "11월 넷째 주 · 가상 데이터",
    team: "디지털혁신팀 4명",
    perf: {
      title: "지점별 신규 대출(건)",
      prevLabel: "10월",
      curLabel: "11월",
      rows: [
        ["강남지점", 412, 455],
        ["종로지점", 298, 251],
        ["분당지점", 355, 362],
        ["부산서면지점", 276, 318],
        ["대구동성로지점", 189, 162],
        ["광주상무지점", 154, 171],
        ["대전둔산지점", 201, 198],
        ["인천구월지점", 233, 287]
      ]
    },
    // 상태는 완료 / 진행 / 지연 / 확인 필요 중 하나
    tasks: [
      ["앱 로그인 오류 패치 테스트", "A대리", "진행", "2차 테스트(화요일)"],
      ["고객센터 FAQ 개편", "B주임", "진행", "화면 검수, 검토 의견 반영"],
      ["12월 시스템 점검 계획", "C과장", "완료", "점검 일정 공유"],
      ["대시보드 시안 반영", "D사원", "확인 필요", "지연 건 색 표시, 지점별 필터 반영"]
    ],
    issues: [
      ["A대리", "QA팀", "테스트 기기 확인 인력 하루 지원 요청"],
      ["C과장", "정보보안팀", "개인정보 포함 감사 자료의 처리 기준 문의 예정"]
    ],
    schedule: [
      ["화요일", "앱 패치 2차 테스트"],
      ["금요일 14~17시", "C과장 외부 교육"]
    ]
  };
  // ▲▲▲ 데이터 끝 ▲▲▲

  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return Number(n).toLocaleString("ko-KR"); };
  var sign = function (n) { return (n > 0 ? "+" : n < 0 ? "-" : "") + fmt(Math.abs(n)); };
  var pct = function (a, b) { return a === 0 ? null : (b - a) / a * 100; };
  var pctText = function (p) { return p === null ? "-" : (p > 0 ? "+" : p < 0 ? "-" : "") + Math.abs(p).toFixed(1) + "%"; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

  $("icon").textContent = DATA.icon || "";
  $("title").textContent = DATA.title;
  $("subtitle").textContent = DATA.subtitle;
  $("team").textContent = DATA.team || "";
  document.title = DATA.title;

  var rows = DATA.perf.rows.map(function (r) {
    return { name: r[0], prev: r[1], cur: r[2], diff: r[2] - r[1], rate: pct(r[1], r[2]) };
  });
  var totalPrev = rows.reduce(function (s, r) { return s + r.prev; }, 0);
  var totalCur = rows.reduce(function (s, r) { return s + r.cur; }, 0);
  var totalRate = pct(totalPrev, totalCur);

  var statusClass = { "완료": "fl-tag--green", "진행": "fl-tag--blue", "지연": "fl-tag--red", "확인 필요": "fl-tag--yellow" };
  var count = function (s) { return DATA.tasks.filter(function (t) { return t[2] === s; }).length; };

  var kpis = [
    { label: DATA.perf.title + " 합계", value: fmt(totalCur), note: DATA.perf.prevLabel + " " + fmt(totalPrev) + " → " + pctText(totalRate), cls: totalRate > 0 ? "up" : totalRate < 0 ? "down" : "" },
    { label: "업무 완료", value: count("완료") + "건", note: "전체 " + DATA.tasks.length + "건" },
    { label: "업무 진행", value: count("진행") + "건", note: "" },
    { label: "지연", value: count("지연") + "건", note: "", cls: count("지연") > 0 ? "down" : "" },
    { label: "확인 필요", value: count("확인 필요") + "건", note: "" },
    { label: "지원 요청", value: DATA.issues.length + "건", note: "" }
  ];
  $("kpis").innerHTML = kpis.map(function (k) {
    return '<div class="fl-card kpi"><div class="label">' + esc(k.label) + '</div><div class="value ' + (k.cls || "") + '">' + esc(k.value) + '</div><div class="note">' + esc(k.note) + "</div></div>";
  }).join("");

  $("perf-title").textContent = DATA.perf.title + " · " + DATA.perf.prevLabel + " vs " + DATA.perf.curLabel;
  $("lg-prev").style.background = "var(--fl-chart-gray)";
  $("lg-cur").style.background = "var(--fl-chart-blue)";
  $("lg-prev-t").textContent = DATA.perf.prevLabel;
  $("lg-cur-t").textContent = DATA.perf.curLabel;

  var W = 760, labelW = 120, padR = 56, rowH = 32, barH = 11, topPad = 4;
  var maxV = Math.max.apply(null, rows.map(function (r) { return Math.max(r.prev, r.cur); })) || 1;
  var H = topPad + rows.length * rowH + 4;
  var svg = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' + esc(DATA.perf.title) + '">';
  rows.forEach(function (r, i) {
    var y = topPad + i * rowH;
    var wPrev = (W - labelW - padR) * r.prev / maxV;
    var wCur = (W - labelW - padR) * r.cur / maxV;
    svg += '<text x="' + (labelW - 8) + '" y="' + (y + 15) + '" text-anchor="end" font-size="12" fill="var(--fl-text)">' + esc(r.name) + "</text>";
    svg += '<rect x="' + labelW + '" y="' + y + '" width="' + wPrev + '" height="' + barH + '" rx="2" fill="var(--fl-chart-gray)"/>';
    svg += '<rect x="' + labelW + '" y="' + (y + barH + 2) + '" width="' + wCur + '" height="' + barH + '" rx="2" fill="var(--fl-chart-blue)"/>';
    svg += '<text x="' + (labelW + wPrev + 4) + '" y="' + (y + barH - 1) + '" font-size="10" fill="var(--fl-text-tertiary)">' + fmt(r.prev) + "</text>";
    svg += '<text x="' + (labelW + wCur + 4) + '" y="' + (y + barH * 2 + 1) + '" font-size="10" fill="var(--fl-text-tertiary)">' + fmt(r.cur) + "</text>";
  });
  svg += "</svg>";
  $("chart").innerHTML = svg;

  $("perf-table").innerHTML =
    "<thead><tr><th>항목</th><th class='n'>" + esc(DATA.perf.prevLabel) + "</th><th class='n'>" + esc(DATA.perf.curLabel) + "</th><th class='n'>증감</th><th class='n'>증감률</th></tr></thead><tbody>" +
    rows.map(function (r) {
      var c = r.rate === null ? "" : r.rate <= -10 ? "rate-down" : r.rate >= 10 ? "rate-up" : "";
      return "<tr><td>" + esc(r.name) + "</td><td class='n'>" + fmt(r.prev) + "</td><td class='n'>" + fmt(r.cur) + "</td><td class='n'>" + sign(r.diff) + "</td><td class='n " + c + "'>" + pctText(r.rate) + "</td></tr>";
    }).join("") + "</tbody>";

  $("task-table").innerHTML =
    "<thead><tr><th>업무</th><th>담당</th><th>상태</th><th>다음 주 계획</th></tr></thead><tbody>" +
    DATA.tasks.map(function (t) {
      return "<tr><td>" + esc(t[0]) + "</td><td>" + esc(t[1]) + "</td><td><span class='fl-tag " + (statusClass[t[2]] || "fl-tag--yellow") + "'>" + esc(t[2]) + "</span></td><td>" + esc(t[3]) + "</td></tr>";
    }).join("") + "</tbody>";

  $("issues").innerHTML = DATA.issues.length ? DATA.issues.map(function (i) {
    return '<li><span class="who">' + esc(i[0]) + " → " + esc(i[1]) + "</span><span>" + esc(i[2]) + "</span></li>";
  }).join("") : '<li class="empty">요청 사항이 없습니다.</li>';

  $("schedule").innerHTML = DATA.schedule.length ? DATA.schedule.map(function (s) {
    return '<li><span class="who">' + esc(s[0]) + "</span><span>" + esc(s[1]) + "</span></li>";
  }).join("") : '<li class="empty">등록된 일정이 없습니다.</li>';
})();
</script>
</body>
</html>
